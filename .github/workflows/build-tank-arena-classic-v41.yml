name: Build Tank Arena Classic v4.1

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Restore source
        shell: bash
        run: |
          cat classic-v41/source.b64.part-* | base64 --decode > source.tar.xz
          tar -xJf source.tar.xz
          mv tank-arena-v4.1 source
          test -f source/public/game.js
          test -f source/android/app/src/main/java/com/credesasq/tankarena/GameView.java

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test game and network code
        working-directory: source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {VERSION,TANKS,createState,moveTank,simulateTrajectory,fire,validateAction,packState,unpackState} from './lib/core.mjs';
          assert.equal(VERSION,'4.1.0');
          assert.equal(Object.keys(TANKS).length,6);
          const a=createState(12345,['A','B'],['tiger','storm']);
          const b=createState(12345,['A','B'],['tiger','storm']);
          assert.deepEqual(a.terrain,b.terrain);
          assert.equal('airdrop' in a,false);
          const x=a.tanks[0].x,f=a.tanks[0].fuel;
          moveTank(a,0,1,.1);
          assert.ok(a.tanks[0].x>x&&a.tanks[0].fuel<f);
          assert.ok(simulateTrajectory(a,a.tanks[0]).length>5);
          assert.equal(validateAction(a,1,{type:'fire'}),false);
          assert.equal(fire(a,0),true);
          assert.equal(unpackState(packState(a)).version,'4.1.0');
          NODE
          node --check public/game.js
          node --check public/core.js
          node --check api/ws.js
          node --check api/test-ws.js

      - name: Publish web assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/v41-live
          cp -R source/public/. /tmp/v41-live/
          cd /tmp/v41-live
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b tank-arena-classic-v41-live
          git add . && git commit -m "Publish Tank Arena Classic 4.1 web"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin tank-arena-classic-v41-live

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build native Android
        working-directory: source/android
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon

      - name: Verify and package
        shell: bash
        run: |
          APK=source/android/app/build/outputs/apk/release/app-release.apk
          AAB=source/android/app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.credesasq.tankarena'" apk-badging.txt
          grep -q "versionName='4.1.0'" apk-badging.txt
          grep -q "launchable-activity:" apk-badging.txt
          grep -q "application-icon-" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          mkdir deliverables
          cp "$APK" deliverables/Tank-Arena-Classic-4.1.0.apk
          cp "$AAB" deliverables/Tank-Arena-Classic-4.1.0.aab
          cp source.tar.xz deliverables/Tank-Arena-Classic-4.1.0-Source.tar.xz
          cp apk-badging.txt apk-signature.txt deliverables/
          (cd deliverables && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Tank-Arena-Classic-v41-Product
          path: deliverables/
          retention-days: 7
          if-no-files-found: error
