name: Build VERITY 0.9.0

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Restore VERITY 0.9.0 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/verity090 /tmp/verity090-diag
          cat ci/verity090.b64.part* > /tmp/verity090-diag/source.b64
          base64 --decode /tmp/verity090-diag/source.b64 > /tmp/verity090.tar.gz
          sha256sum /tmp/verity090.tar.gz | tee /tmp/verity090-diag/source.sha256
          test "$(sha256sum /tmp/verity090.tar.gz | cut -d' ' -f1)" = "95058898d5516b2cec3447e0bc8422c677d1182a4005b3db19456b9c4f919048"
          tar -tzf /tmp/verity090.tar.gz > /tmp/verity090-diag/source-files.txt
          tar -xzf /tmp/verity090.tar.gz -C /tmp/verity090

      - name: Generate entity textures and logo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import math, os, struct, zlib

          def save(path, w, h, pixel):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              rows=[]
              for y in range(h):
                  row=bytearray()
                  for x in range(w):
                      row.extend(pixel(x,y))
                  rows.append(b'\x00'+bytes(row))
              def chunk(kind,data):
                  return struct.pack('>I',len(data))+kind+data+struct.pack('>I',zlib.crc32(kind+data)&0xffffffff)
              png=(b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(b''.join(rows),9))+chunk(b'IEND',b''))
              with open(path,'wb') as f: f.write(png)

          root='/tmp/verity090/src/main/resources'

          def verity(x,y):
              if y>=112:
                  return (220,38,58,255) if x>=96 else ((255,105,160,255) if x>=64 else (80,225,255,255))
              if y>=96: return (9,18,38,255)
              if y>=80: return (248,252,255,255)
              if y>=64: return (3,7,16,255)
              glow=max(0.0,1.0-math.hypot(x-50,y-28)/85.0)
              return (int(20+25*glow),int(105+65*glow),int(210+45*glow),255)

          def box(x,y):
              plank=(y//16)%2
              if x%32<3 or y%16<2: return (68,38,23,255)
              if 58<x<70 or 58<y<70: return (104,116,128,255)
              return (126+plank*18,72+plank*10,38+plank*5,255)

          def logo(x,y):
              dx=x-128; dy=y-128
              if dx*dx+dy*dy>94*94: return (7,12,25,255)
              if (x-96)**2+(y-105)**2<12**2 or (x-160)**2+(y-105)**2<12**2: return (245,250,255,255)
              if 144<y<154 and abs(x-128)<42: return (255,225,90,255)
              return (34,139,255,255)

          save(root+'/assets/morrow/textures/entity/verity.png',128,128,verity)
          save(root+'/assets/morrow/textures/entity/verity_box.png',128,128,box)
          save(root+'/logo.png',256,256,logo)
          PY

      - name: Build Forge mod
        shell: bash
        run: |
          set -o pipefail
          cd /tmp/verity090
          gradle clean build --stacktrace --no-daemon 2>&1 | tee /tmp/verity090-diag/gradle.log

      - name: Prepare and validate artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          JAR="$(find /tmp/verity090/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$JAR"
          cp "$JAR" artifact/VERITY-Blue-Circle-0.9.0-Forge-1.20.1.jar
          unzip -t artifact/VERITY-Blue-Circle-0.9.0-Forge-1.20.1.jar | tee /tmp/verity090-diag/jar-test.txt
          unzip -l artifact/VERITY-Blue-Circle-0.9.0-Forge-1.20.1.jar | tee /tmp/verity090-diag/jar-files.txt
          grep -q 'ClientSpeechController.class' /tmp/verity090-diag/jar-files.txt
          grep -q 'VeritySpeechPacket.class' /tmp/verity090-diag/jar-files.txt
          grep -q 'AiRuntime.class' /tmp/verity090-diag/jar-files.txt
          grep -q 'VerityBrain.class' /tmp/verity090-diag/jar-files.txt
          grep -q 'PrankModeConfig.class' /tmp/verity090-diag/jar-files.txt
          sha256sum artifact/VERITY-Blue-Circle-0.9.0-Forge-1.20.1.jar | tee /tmp/verity090-diag/jar.sha256

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VERITY-Blue-Circle-0.9.0-Forge-1.20.1
          path: artifact/VERITY-Blue-Circle-0.9.0-Forge-1.20.1.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VERITY-0.9.0-build-diagnostics
          path: /tmp/verity090-diag
          if-no-files-found: warn
