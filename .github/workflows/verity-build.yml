name: Build VERITY 0.6.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Restore source archive
        shell: bash
        run: |
          mkdir -p /tmp/verity-src
          cat ci/textsrc.b64.part* | base64 --decode > /tmp/verity-textsrc.tar.gz
          tar -xzf /tmp/verity-textsrc.tar.gz -C /tmp/verity-src
          mkdir -p /tmp/verity-src/src/main/resources/assets/morrow/textures/entity
          cat ci/verity-png.b64.part* | base64 --decode > /tmp/verity-src/src/main/resources/assets/morrow/textures/entity/verity.png
          cat ci/box-png.b64.part* | base64 --decode > /tmp/verity-src/src/main/resources/assets/morrow/textures/entity/verity_box.png
          cat ci/logo-png.b64.part* | base64 --decode > /tmp/verity-src/src/main/resources/logo.png
      - name: Build Forge mod
        shell: bash
        run: |
          cd /tmp/verity-src
          gradle clean build --stacktrace
      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifact
          cp /tmp/verity-src/build/libs/*.jar artifact/VERITY-Blue-Circle-0.6.0-Forge-1.20.1.jar
      - uses: actions/upload-artifact@v4
        with:
          name: VERITY-Blue-Circle-0.6.0-Forge-1.20.1
          path: artifact/VERITY-Blue-Circle-0.6.0-Forge-1.20.1.jar
          if-no-files-found: error
