name: Build VERITY 0.6.0

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["verity-build-0.6.0"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Restore source and generate textures
        shell: bash
        run: |
          mkdir -p /tmp/verity-src
          cat ci/textsrc.b64.part* | base64 --decode > /tmp/verity-textsrc.tar.gz
          tar -xzf /tmp/verity-textsrc.tar.gz -C /tmp/verity-src
          python3 - <<'PY'
          import math, os, struct, zlib
          def save(path, w, h, pixel):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              rows=[]
              for y in range(h):
                  row=bytearray()
                  for x in range(w): row.extend(pixel(x,y))
                  rows.append(b'\x00'+bytes(row))
              def chunk(t,d):
                  return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
              data=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(b''.join(rows),9))+chunk(b'IEND',b'')
              open(path,'wb').write(data)
          root='/tmp/verity-src/src/main/resources'
          def verity(x,y):
              if y>=112:
                  if x>=96:return (220,38,58,255)
                  if x>=64:return (255,105,160,255)
                  return (80,225,255,255)
              if y>=96:return (9,18,38,255)
              if y>=80:return (248,252,255,255)
              if y>=64:return (3,7,16,255)
              glow=max(0,1-math.hypot(x-50,y-28)/85)
              return (int(20+25*glow),int(105+65*glow),int(210+45*glow),255)
          def box(x,y):
              plank=(y//16)%2
              base=(126+plank*18,72+plank*10,38+plank*5,255)
              if x%32<3 or y%16<2:return (68,38,23,255)
              if 58<x<70 or 58<y<70:return (104,116,128,255)
              return base
          def logo(x,y):
              bg=(10,20,38,255); dx=x-128; dy=y-128
              if dx*dx+dy*dy>92*92:return bg
              col=(44,153,255,255)
              if (x-96)**2+(y-105)**2<11**2 or (x-160)**2+(y-105)**2<11**2:return (245,250,255,255)
              if 145<y<153 and abs(x-128)<40:return (255,229,100,255)
              return col
          save(root+'/assets/morrow/textures/entity/verity.png',128,128,verity)
          save(root+'/assets/morrow/textures/entity/verity_box.png',128,128,box)
          save(root+'/logo.png',256,256,logo)
          PY
      - name: Build Forge mod
        shell: bash
        run: |
          cd /tmp/verity-src
          gradle clean build --stacktrace
      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifact
          cp /tmp/verity-src/build/libs/*.jar artifact/VERITY-Blue-Circle-0.6.0-Forge-1.20.1.jar
      - uses: actions/upload-artifact@v4
        with:
          name: VERITY-Blue-Circle-0.6.0-Forge-1.20.1
          path: artifact/VERITY-Blue-Circle-0.6.0-Forge-1.20.1.jar
          if-no-files-found: error
