name: Build VERITY 0.7.0

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Restore VERITY 0.6.0 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/verity-src /tmp/verity-diag
          cat ci/textsrc.b64.part* > /tmp/verity-diag/combined.b64
          printf '9' | dd of=/tmp/verity-diag/combined.b64 bs=1 seek=31907 conv=notrunc status=none
          wc -c /tmp/verity-diag/combined.b64 | tee /tmp/verity-diag/base-size.txt
          base64 --decode /tmp/verity-diag/combined.b64 > /tmp/verity-textsrc.tar.gz
          sha256sum /tmp/verity-textsrc.tar.gz | tee /tmp/verity-diag/base-sha256.txt
          test "$(sha256sum /tmp/verity-textsrc.tar.gz | cut -d' ' -f1)" = "1ba4b4eee8bb7f2db081deb7f0bd1e6f3b3e8c134123aff813aeed64ccc16053"
          tar -xzf /tmp/verity-textsrc.tar.gz -C /tmp/verity-src
      - name: Apply VERITY 0.7.0 horror overlay
        shell: bash
        run: |
          set -euo pipefail
          cat ci/verity070-overlay.b64.part* > /tmp/verity-diag/overlay.b64
          wc -c /tmp/verity-diag/overlay.b64 | tee /tmp/verity-diag/overlay-size.txt
          base64 --decode /tmp/verity-diag/overlay.b64 > /tmp/verity-overlay.tar.gz
          sha256sum /tmp/verity-overlay.tar.gz | tee /tmp/verity-diag/overlay-sha256.txt
          test "$(sha256sum /tmp/verity-overlay.tar.gz | cut -d' ' -f1)" = "3bf8fca6f33e284c565c02f556fbdb8a75b093497a3ff44fed8ea0b348669e7b"
          tar -tzf /tmp/verity-overlay.tar.gz | tee /tmp/verity-diag/overlay-list.txt
          tar -xzf /tmp/verity-overlay.tar.gz -C /tmp/verity-src
          grep '^mod_version=0.7.0$' /tmp/verity-src/gradle.properties
      - name: Generate textures
        shell: bash
        run: |
          python3 - <<'PY'
          import math, os, struct, zlib
          def save(path,w,h,pixel):
              os.makedirs(os.path.dirname(path),exist_ok=True)
              rows=[]
              for y in range(h):
                  row=bytearray()
                  for x in range(w): row.extend(pixel(x,y))
                  rows.append(b'\x00'+bytes(row))
              def chunk(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
              data=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(b''.join(rows),9))+chunk(b'IEND',b'')
              open(path,'wb').write(data)
          root='/tmp/verity-src/src/main/resources'
          def verity(x,y):
              if y>=112: return (220,38,58,255) if x>=96 else ((255,105,160,255) if x>=64 else (80,225,255,255))
              if y>=96:return (9,18,38,255)
              if y>=80:return (248,252,255,255)
              if y>=64:return (3,7,16,255)
              glow=max(0,1-math.hypot(x-50,y-28)/85)
              return (int(20+25*glow),int(105+65*glow),int(210+45*glow),255)
          def box(x,y):
              plank=(y//16)%2
              if x%32<3 or y%16<2:return (68,38,23,255)
              if 58<x<70 or 58<y<70:return (104,116,128,255)
              return (126+plank*18,72+plank*10,38+plank*5,255)
          def logo(x,y):
              dx=x-128;dy=y-128
              if dx*dx+dy*dy>92*92:return (10,20,38,255)
              if (x-96)**2+(y-105)**2<11**2 or (x-160)**2+(y-105)**2<11**2:return (245,250,255,255)
              if 145<y<153 and abs(x-128)<40:return (255,48,64,255)
              return (21,88,175,255)
          save(root+'/assets/morrow/textures/entity/verity.png',128,128,verity)
          save(root+'/assets/morrow/textures/entity/verity_box.png',128,128,box)
          save(root+'/logo.png',256,256,logo)
          PY
      - name: Build Forge mod
        shell: bash
        run: |
          set -o pipefail
          cd /tmp/verity-src
          gradle clean build --stacktrace 2>&1 | tee /tmp/verity-diag/gradle.log
      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifact
          cp /tmp/verity-src/build/libs/*.jar artifact/VERITY-Blue-Circle-0.7.0-Forge-1.20.1.jar
          sha256sum artifact/*.jar | tee /tmp/verity-diag/jar-sha256.txt
          unzip -t artifact/*.jar | tee /tmp/verity-diag/jar-test.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VERITY-Blue-Circle-0.7.0-Forge-1.20.1
          path: artifact/VERITY-Blue-Circle-0.7.0-Forge-1.20.1.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VERITY-0.7.0-build-diagnostics
          path: /tmp/verity-diag
          if-no-files-found: warn
