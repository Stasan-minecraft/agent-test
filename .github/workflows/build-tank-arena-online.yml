name: Build Tank Arena Online Product

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source
        shell: bash
        run: |
          cat tank-arena-online-source.b64.part-* | base64 --decode > source.tar.gz
          mkdir product
          tar -xzf source.tar.gz -C product

      - name: Test deterministic game core
        working-directory: product/web
        run: |
          node --check core.js
          node --check game.js
          node core.test.mjs

      - name: Publish web source branch
        shell: bash
        run: |
          rm -rf /tmp/tank-live
          mkdir -p /tmp/tank-live
          cp -R product/web/. /tmp/tank-live/
          cd /tmp/tank-live
          git init
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -b tank-arena-online-live
          git add .
          git commit -m "Publish Tank Arena Online 2.0.0"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin tank-arena-online-live
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Google Play upload key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "${GITHUB_WORKSPACE}/tank-arena-upload-key.jks" \
            -storepass 'TankArena2026!' \
            -keypass 'TankArena2026!' \
            -alias tankarena \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Tank Arena Online, OU=CREDESASQ, O=CREDESASQ, L=Kyiv, C=UA"

      - name: Build signed APK and AAB
        working-directory: product/android
        env:
          TA_KEYSTORE: ${{ github.workspace }}/tank-arena-upload-key.jks
          TA_STORE_PASSWORD: TankArena2026!
          TA_KEY_ALIAS: tankarena
          TA_KEY_PASSWORD: TankArena2026!
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon

      - name: Verify Android packages
        shell: bash
        run: |
          APK="product/android/app/build/outputs/apk/release/app-release.apk"
          AAB="product/android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | tee apk-badging.txt
          grep -q "launchable-activity:" apk-badging.txt
          grep -q "application-icon-" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" Tank-Arena-Online-2.0.0.apk
          cp "$AAB" Tank-Arena-Online-2.0.0.aab
          cat > signing-credentials.txt <<'TXT'
          Keystore: tank-arena-upload-key.jks
          Alias: tankarena
          Store password: TankArena2026!
          Key password: TankArena2026!
          Keep this keystore private. It is required for future Google Play updates.
          TXT
          sha256sum Tank-Arena-Online-2.0.0.apk Tank-Arena-Online-2.0.0.aab tank-arena-upload-key.jks > SHA256SUMS.txt

      - name: Upload complete product
        uses: actions/upload-artifact@v4
        with:
          name: Tank-Arena-Online-Complete-Product
          path: |
            Tank-Arena-Online-2.0.0.apk
            Tank-Arena-Online-2.0.0.aab
            tank-arena-upload-key.jks
            signing-credentials.txt
            SHA256SUMS.txt
            apk-badging.txt
            product/README.md
          if-no-files-found: error
          retention-days: 7
