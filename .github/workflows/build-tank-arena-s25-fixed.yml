name: Build Tank Arena S25 Fixed APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source archive
        shell: bash
        run: |
          cat tank-arena-source.b64.part-* | base64 --decode > source.tar.gz
          tar -xzf source.tar.gz

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Lint and build signed release APK
        working-directory: tank-arena-android
        run: gradle :app:lintRelease :app:assembleRelease --stacktrace --no-daemon

      - name: Verify package, icon, alignment and signature
        shell: bash
        run: |
          APK="tank-arena-android/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | tee apk-badging.txt
          grep -q "launchable-activity:" apk-badging.txt
          grep -q "application-icon-" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" Tank-Arena-S25-Ultra-Android16-Fixed-v1.1.apk
          sha256sum Tank-Arena-S25-Ultra-Android16-Fixed-v1.1.apk > Tank-Arena-S25-Ultra-Android16-Fixed-v1.1.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tank-Arena-S25-Fixed-APK
          path: |
            Tank-Arena-S25-Ultra-Android16-Fixed-v1.1.apk
            Tank-Arena-S25-Ultra-Android16-Fixed-v1.1.apk.sha256
            apk-badging.txt
          if-no-files-found: error
          retention-days: 7
